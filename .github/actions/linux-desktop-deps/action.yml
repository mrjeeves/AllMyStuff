name: Linux desktop build dependencies
description: Keep CI and release builds on the same native dependency setup.
inputs:
  webview:
    description: Install the GTK webview and bundle dependencies.
    default: "true"
  ffmpeg:
    description: Install FFmpeg headers for the optional hwenc build.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WITH_WEBVIEW: ${{ inputs.webview }}
        WITH_FFMPEG: ${{ inputs.ffmpeg }}
      run: |
        set -euo pipefail
        . /etc/os-release
        if [[ "$VERSION_ID" == "22.04" ]]; then
          # Preserve the release workaround for the unhealthy Azure mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]] && \
             grep -q 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          # Jammy's stock PipeWire headers predate libspa's required fields.
          # Use builds for Jammy to retain the release's glibc 2.35 floor.
          sudo add-apt-repository -y --no-update ppa:pipewire-debian/pipewire-upstream
        fi
        apt_options=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        packages=(
          libasound2-dev libpipewire-0.3-dev libxkbcommon-dev libgbm-dev
          libudev-dev libgtk-3-dev libwayland-dev libssl-dev
        )
        if [[ "$WITH_WEBVIEW" == "true" ]]; then
          packages+=(libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils)
        fi
        if [[ "$WITH_FFMPEG" == "true" ]]; then
          packages+=(libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev)
        fi
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y "${packages[@]}"
