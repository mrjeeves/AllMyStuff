name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library workspace — scanner, graph, protocol, bridge, session,
  # updater, CLI. Run on all three platforms so the macOS / Windows device
  # probes and the updater are compiled and unit-tested where they run.
  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows runtime installer regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-runtime.tests.ps1
      # `just release` runs this with the OS-provided shell. macOS still ships
      # Bash 3.2, so execute the real pin/lock guard there in CI rather than
      # discovering Bash-4-only builtins while cutting a release.
      - name: release pin-lock guard (system Bash)
        if: matrix.os == 'macos-latest'
        run: bash scripts/sync-pinned-locks.sh --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: scan smoke test
        run: cargo run -p allmystuff-cli -- capabilities

  # The Svelte front-end: typecheck + production build.
  gui:
    name: GUI front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

  # The headless mesh node (its own workspace): the engine the GUI links + the
  # `allmystuff-serve` binary `allmystuff serve` runs. Same media stack as the
  # GUI backend, minus the webview — built and tested on all three platforms
  # so the headless node compiles everywhere it ships.
  node:
    name: Node · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ffmpeg-next 6.1 requires FFmpeg 6 headers. Ubuntu 26.04 ships
        # FFmpeg 8, which removed avfft.h; migrate the bindings deliberately
        # before changing this reference platform.
        # Exercise the release floor and both shipped Mac/Linux CPUs too.
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Opus bundled by `audiopus_sys` (via the `opus` crate) declares an
    # ancient `cmake_minimum_required`, which CMake 4.x on the runners refuses
    # outright. This shim re-enables the old policy floor for every CMake build
    # in the job (Opus, and mozjpeg via nokhwa). Same fix the GUI backend and
    # release jobs carry.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      # libgtk-3-dev + libwayland-dev aren't a webview dependency — they pull
      # the X11 / XCB / Wayland system libs that the screen-capture (xcap) and
      # input (enigo, xcb) crates link against. The GUI backend job gets these
      # transitively through webkit/gtk; the headless node has to ask for them.
      - name: Linux media deps
        if: runner.os == 'Linux'
        timeout-minutes: 20
        uses: ./.github/actions/linux-desktop-deps
        with:
          webview: "false"
          ffmpeg: ${{ matrix.os == 'ubuntu-24.04' }}
      - name: Verify FFmpeg binding compatibility
        if: matrix.os == 'ubuntu-24.04'
        run: |
          version=$(pkg-config --modversion libavcodec)
          echo "libavcodec version: $version (ffmpeg-next 6.1 expects major 60)"
          if [[ "$version" != 60.* ]]; then
            echo "::error::FFmpeg headers do not match ffmpeg-next 6.1; use an FFmpeg 6 runner."
            exit 1
          fi
      - name: rustfmt
        if: runner.os == 'Linux'
        working-directory: node
        run: cargo fmt --check
      # clippy on the Linux reference platform only. This engine is the former
      # GUI backend, which CI has always treated as compile-checked (not
      # clippy'd) on macOS/Windows — `cargo test` below still builds every
      # target there, so the platform-specific capture/input code is verified;
      # `-D warnings` lint policy stays on Linux, matching that history.
      - name: clippy
        if: matrix.os == 'ubuntu-24.04'
        working-directory: node
        run: cargo clippy --locked --all-targets -- -D warnings
      # Lint + build the hardware-encode path too (FFmpeg dev libs installed
      # above). Linux is enough to verify the `hwenc` code; the per-OS encoder
      # list is the only platform-specific part. The default build above stays
      # software-only so the macOS/Windows jobs need no FFmpeg toolchain.
      - name: clippy (hwenc)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: node
        run: cargo clippy --locked --all-targets --features hwenc -- -D warnings
      # The capture-less path the iOS/Android app links: `mesh.rs` is shared
      # with the mobile build, which compiles it against `stubs/video.rs` /
      # `stubs/terminal.rs` instead of the real capture backends. Nothing else
      # in CI builds that config (the desktop jobs use `host`; `gui-mobile`
      # drops `mesh` to stay NDK-free), so stub drift — a new `video`/`terminal`
      # API added to the host path but not the stub — used to surface only on
      # the developer's `tauri ios` build. This check catches it in CI.
      - name: check capture-less stub (mobile config)
        if: runner.os == 'Linux'
        working-directory: node
        run: cargo check --locked --no-default-features
      - name: test
        working-directory: node
        run: cargo test --locked
      - name: SMB dependency licenses and distribution notices
        working-directory: node
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --locked --format-version 1 --filter-platform "$host" |
            python ../scripts/check-smb-licenses.py --check-notices ../docs/THIRD-PARTY-SMB-NOTICES.txt
      - name: native SMB client interoperability (sparse files beyond 4 GiB)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        working-directory: node
        shell: bash
        run: |
          set -euo pipefail
          helper_binary=$(cargo build --locked --bin allmystuff-serve --message-format=json |
            python3 -c 'import sys,json; rows=[json.loads(line) for line in sys.stdin]; print(next(row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("target",{}).get("name")=="allmystuff-serve" and row.get("executable")))')
          test_binary=$(cargo test --locked --lib --no-run --message-format=json |
            python3 -c 'import sys,json; rows=[json.loads(line) for line in sys.stdin]; print(next(row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("profile",{}).get("test") and row.get("target",{}).get("kind")==["lib"] and row.get("executable")))')
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # Match release identity. Apple Silicon's linker signs ad hoc;
            # Intel's unsigned cargo executables need the explicit step.
            codesign --force --sign - "$helper_binary"
            codesign --force --sign - "$test_binary"
            codesign --verify --strict "$helper_binary"
            # Fresh headless VMs may not have loaded Apple's built-in SMB
            # filesystem yet. Load the OS component, as Linux does for cifs;
            # the actual mount still runs as the unprivileged desktop user.
            sudo /usr/bin/kmutil load --bundle-identifier com.apple.filesystems.smbfs
            sudo /usr/bin/kmutil showloaded --bundle-identifier com.apple.filesystems.smbfs
          fi
          test_name=unix_smb_mount::tests::native_smb_client_reads_and_writes_beyond_four_gib
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo modprobe cifs
            sudo env ALLMYSTUFF_TEST_NATIVE_SMB_HELPER="$helper_binary" "$test_binary" --exact "$test_name" --ignored --test-threads=1 --nocapture
          else
              # NetFS authorizes custom locations with UI. Prepare one empty
              # standard volume so unattended CI needs no consent dialog;
              # mounting and all file I/O still run as the ordinary user.
              fixture="/Volumes/AMS SMB CI ${GITHUB_RUN_ID}"
              sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$fixture"
              trap 'if [[ -e "$fixture" ]]; then sudo rmdir "$fixture"; fi' EXIT
              export ALLMYSTUFF_TEST_NATIVE_SMB_MOUNT="$fixture"
              if ! ALLMYSTUFF_TEST_NATIVE_SMB_HELPER="$helper_binary" "$test_binary" --exact "$test_name" --ignored --test-threads=1 --nocapture; then
                id
                stat -f 'Console owner: %Su (%u)' /dev/console
                ls -l /dev/nsmb* 2>/dev/null || true
                # Only this disposable fixture runs here. Redact generated
                # credentials if an OS diagnostic happens to include one.
                sudo /usr/bin/log show --last 1m --style compact --info --debug \
                  --predicate '(process == "kernel" OR process == "NetAuthSysAgent" OR process == "NetAuthAgent" OR process == "allmystuff-serve") AND (eventMessage CONTAINS[c] "smb" OR eventMessage CONTAINS[c] "mount")' \
                  | sed -E 's/[[:xdigit:]]{64}/<redacted>/g' | tail -80 || true
                exit 1
              fi
          fi
      - name: test (hwenc)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: node
        run: cargo test --locked --features hwenc

  # The Tauri backend (its own workspace): cpal audio bridge + mesh session
  # + control client. Compile-checked on all three platforms — this is what
  # verifies the streaming code the headless dev container can't link.
  gui-backend:
    name: GUI backend · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Match every native release target; keep latest Linux as a forward
        # compatibility check alongside the glibc 2.35 release floor.
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    # Skip bundling the myownmesh daemon sidecar here — CI only needs to
    # verify the app compiles. build.rs stamps a stub so tauri-build's
    # externalBin check passes; the real bundle happens on dev / release
    # builds (and is exercised by `just dev`).
    #
    # CMAKE_POLICY_VERSION_MINIMUM re-enables the pre-3.5 policy floor that the
    # Opus bundled by `audiopus_sys` (via the node engine's `opus` dep) needs —
    # CMake 4.x on the runners rejects it otherwise.
    env:
      ALLMYSTUFF_SKIP_SIDECAR: "1"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Linux webview + audio deps
        if: runner.os == 'Linux'
        timeout-minutes: 20
        uses: ./.github/actions/linux-desktop-deps
      # Tauri's build script wants the frontend dist to exist.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: build frontend (for tauri build script)
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: cargo check backend
        working-directory: gui/src-tauri
        run: cargo check --locked
      # The backend has real unit tests now (the terminal's PTY host runs a
      # live openpty/ConPTY round-trip per OS) — run them where they run.
      - name: cargo test backend
        working-directory: gui/src-tauri
        run: cargo test --locked

  # The mobile (iOS/Android) Tauri shell. It reuses the same Svelte frontend
  # as the desktop and embeds the phone's viewer/controller core
  # (allmystuff-mobile-core) instead of spawning a desktop node, so it never
  # pulls the GTK/WebKitGTK desktop webview — on device Tauri uses the system
  # webview. We verify it type-checks for a real mobile target. No Android NDK
  # is needed yet: this shell links no C-building crate (the embedded
  # myownmesh-core engine, which brings `ring`, lands in a later slice).
  gui-mobile:
    name: GUI mobile · android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/mobile
      # tauri's build script / generate_context! want the frontend dist to
      # exist — it's the same build the desktop shell consumes.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: build frontend (for tauri build script)
        working-directory: gui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Build without the `mesh` feature so this stays NDK-free: the embedded
      # engine (enabled by default for on-device builds) pulls `ring`, a C build
      # that needs the Android NDK. This job type-checks the shell + the pure
      # frontend embed; the engine cross-compile is exercised on the device
      # build (and covered by `allmystuff-mesh`'s host tests).
      - name: cargo check mobile shell (android target, no engine)
        working-directory: gui/mobile
        run: cargo check --no-default-features --target aarch64-linux-android
