# The GUI's Rust crate lives outside the main Cargo workspace so a
# `cargo build --workspace` / `cargo test --workspace` at the repo root
# stays fast and webview-free (no Tauri compile). An empty `[workspace]`
# table makes this crate its own single-member workspace root — the same
# split MyOwnMesh uses for its GUI.
[workspace]

[package]
name = "allmystuff-gui"
version = "0.1.12"
description = "AllMyStuff GUI — Tauri shell: scans this machine and talks to the myownmesh daemon over its control socket."
authors = ["Chris Paul"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[[bin]]
name = "allmystuff-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Cross-platform *rich* clipboard — text, image, and crucially file lists
# (CF_HDROP on Windows, file URLs on macOS, text/uri-list on Linux), which
# the clipboard-manager plugin can't read or write. This is the OS-clipboard
# side of cross-machine copy/paste; the bytes still move over the files
# plane / media channel.
clipboard-rs = "0.2"

# Async runtime — control-socket client + Tauri commands. "process"
# backs the daemon self-update the spawner runs when the installed
# myownmesh is older than the pin.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }

# Local IPC: same crate the daemon uses, so control-socket address
# resolution stays identical across both ends of the wire.
interprocess = { version = "2", features = ["tokio"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
parking_lot = "0.12"

# System RNG for minting a fleet's shared key (the owned-roster grouping
# secret). Already in the resolved tree via Tauri/Tokio; pulled in directly
# here so the key generation is explicit.
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AllMyStuff's own crates — the scanner, the graph model, the wire types,
# and the hardware→capability bridge. Pulled by path from the sibling
# workspace; the GUI is the one place all four come together.
allmystuff-inventory = { path = "../../crates/allmystuff-inventory" }
allmystuff-graph = { path = "../../crates/allmystuff-graph" }
allmystuff-protocol = { path = "../../crates/allmystuff-protocol" }
allmystuff-bridge = { path = "../../crates/allmystuff-bridge" }
allmystuff-session = { path = "../../crates/allmystuff-session" }
allmystuff-updater = { path = "../../crates/allmystuff-updater" }
# The CEC service client — optional accounts, Ask-for-Help, Private Line, and
# the per-customer CEC mesh. Brings the real reqwest transport (its default).
allmystuff-cec = { path = "../../crates/allmystuff-cec" }

# Cross-platform audio capture + playback for the media plane — CoreAudio
# on macOS, WASAPI on Windows, ALSA on Linux. Same crate (and version)
# MyOwnLLM uses for its audio.
cpal = "0.15"
# Cross-platform PTY for the mesh-native terminal — openpty on Unix,
# ConPTY on Windows — so a terminal session behaves the same across the
# whole OS matrix without an sshd anywhere. WezTerm's own PTY layer.
portable-pty = "0.9"
xcap = "0.9"
# `simd` = runtime-detected AVX2 fDCT/color-convert — a multiple of encode
# speed on typical x86-64 desktops, plain safe Rust elsewhere.
jpeg-encoder = { version = "0.7", features = ["simd"] }
enigo = "0.6"
# Camera capture for video routes — V4L2 on Linux, AVFoundation on macOS,
# Media Foundation on Windows, one API over all three. Frames decode to
# RGBA (its `decoding` default carries the MJPEG path most webcams speak,
# mozjpeg built from source like openh264/opus) and feed the same encoder
# pipeline screens use.
nokhwa = { version = "0.10", features = ["input-native"] }
# H.264 encode for the mesh's video track lane (Cisco's encoder, built
# from source — needs only a C/C++ toolchain). MJPEG stays as the
# fallback wherever this can't run or the peer can't decode.
openh264 = "0.9"
# Opus encode/decode for the mesh's audio track lane (libopus, built
# from source like openh264). The PCM-over-channel stream stays as the
# fallback for older daemons/peers, exactly like MJPEG for video.
opus = "0.3"
# Access units ride the daemon control socket as base64 (same encoding
# the session crate's media frames use).
base64 = "0.22"
# The per-pixel hot loops (frame downscale/strip), split out so dev
# builds optimize them — see the crate's manifest for the why.
allmystuff-pixels = { path = "pixels" }

# PR_SET_PDEATHSIG for the daemon lifetime tie (see
# daemon_spawn::tie_daemon_lifetime) — the kernel SIGKILLs the daemon
# when a crashed or force-killed app can no longer clean up after itself.
# libloading dlopens libpulse-simple at runtime for system-audio capture
# (the monitor of the default sink) — dlopen rather than a link-time
# dependency so the binary still runs on a box without a pulse server.
# zbus drives the ScreenCast portal with restore tokens
# (wayland_capture.rs) and the ScreenSaver keep-awake inhibitor
# (wake.rs); pipewire consumes the portal's stream. All four crates are
# already in the resolved tree (Tauri's Linux stack; xcap links the same
# pipewire), so this adds features, not second compiles.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libloading = "0.8"
zbus = "5"
pipewire = "0.9"
# DPMS ForceLevel(On) — the X11/XWayland "light the panel now" call
# (wake::force_display_on). Same xcb the tree already builds for xcap;
# the dpms feature just generates one more extension module.
xcb = { version = "1", features = ["dpms"] }

# IOKit power assertions (NoDisplaySleep) while hosting a screen stream —
# wake.rs. core-foundation is already in the resolved tree via Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# In-house DXGI Output Duplication for screen capture, and the
# virtual-desktop absolute mouse move (enigo's Abs can only reach the
# primary monitor). Same version the resolved tree already carries via
# Tauri, so this adds features, not a second compile of the crate. See
# `win_capture.rs` for why xcap's recorder can't be used here.
# windows-sys backs the daemon lifetime tie (a job object with
# kill-on-close — daemon_spawn::tie_daemon_lifetime), same story: the
# version the tree already resolves.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The media plane touches every screen pixel every frame; the crates doing
# that work get speed while the rest of the app keeps optimizing for size —
# and dev builds get the same treatment so `just dev` streams at a usable
# rate instead of running the pixel loops unoptimized.
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.release.package.openh264]
opt-level = 3
[profile.release.package.openh264-sys2]
opt-level = 3
[profile.release.package.xcap]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.allmystuff-pixels]
opt-level = 3
# Camera frames pass through nokhwa's pixel-format conversion (YUYV→RGBA
# in Rust, MJPEG via mozjpeg) every tick — same treatment as the rest of
# the media plane.
[profile.release.package.nokhwa]
opt-level = 3
[profile.release.package.nokhwa-core]
opt-level = 3
[profile.release.package.mozjpeg]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.xcap]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.allmystuff-pixels]
opt-level = 3
[profile.dev.package.nokhwa]
opt-level = 3
[profile.dev.package.nokhwa-core]
opt-level = 3
[profile.dev.package.mozjpeg]
opt-level = 3
# The media plane's framing also leans on these every packet (JSON lines
# on the control socket, base64 payloads) — worth optimizing in dev too.
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
